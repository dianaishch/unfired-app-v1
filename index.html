<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#000000" />
<title>UNFIRED</title>
<link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="device">
    <div id="app" class="app"></div>
    <div id="layers"></div>
    <div id="toasts" class="toasts"></div>
  </div>
  <div id="devbar" class="devbar" hidden>
    <div class="devgrp">Main screens</div>
    <button data-dev="card:idea-bird-flock">Idea with thin plan</button>
    <button data-dev="card:lavender-teapot-2">Making card</button>
    <button data-dev="card:starred-plates">Finished card</button>
    <button data-dev="rtp">Ready to post</button>
    <button data-dev="edit">Edit: exported post</button>
    <div class="devgrp">Capture and chat</div>
    <button data-dev="log">Log screen</button>
    <button data-dev="log-rec">Log screen, recording</button>
    <div class="devgrp">Live and devices</div>
    <button data-dev="lock">Lock screen live activity</button>
    <div class="devgrp">Flows</div>
    <button data-dev="shake">Collide (random)</button>
    <button data-dev="onboard">Onboarding</button>
    <div class="devgrp">Data</div>
    <button data-dev="reset">Reset demo data</button>
  </div>
  <button id="devtoggle" class="devtoggle" title="Prototype controls">◍</button>
  <script type="module" src="js/app.js"></script>
</body>
</html>
