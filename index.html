<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#000000" />
<title>UNFIRED</title>
<link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="device">
    <div id="app" class="app"></div>
    <div id="layers"></div>
    <div id="toasts" class="toasts"></div>
  </div>
  <div id="devbar" class="devbar" hidden>
    <button data-dev="shake">Shake ⇧S</button>
    <button data-dev="lock">Lock screen ⇧L</button>
    <button data-dev="watch">Watch ⇧W</button>
    <button data-dev="scan">Photo scan ⇧P</button>
    <button data-dev="onboard">Onboarding</button>
    <button data-dev="reset">Reset demo data</button>
  </div>
  <button id="devtoggle" class="devtoggle" title="Prototype controls">◍</button>
  <script type="module" src="js/app.js"></script>
</body>
</html>
