<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fill size</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#040404;font-family:'Helvetica Neue',Helvetica,sans-serif;color:#f6f4ec}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #6ab8ef;outline-offset:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:#292929}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:12px;background:#f6f4ec;margin-top:-10px}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#292929}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border:none;border-radius:12px;background:#f6f4ec}
a{color:#f6f4ec}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 402px; height: 874px; box-sizing: border-box; background: #040404; display: flex; flex-direction: column; overflow: hidden; font-family: 'Helvetica Neue', Helvetica, sans-serif; color: #f6f4ec">
<div style="display: flex; gap: 20px; align-items: center; padding: 20px 16px 4px">
<button aria-label="Back" style="width: 40px; height: 40px; border-radius: 29px; flex-shrink: 0; background: #0e0e0e; border: 1px solid #292929; display: flex; align-items: center; justify-content: center; color: #f6f4ec; padding: 0"><svg width="16" height="16" style="fill: none; stroke: currentColor; stroke-width: 1.6px"><path d="M10 3 L5 8 L10 13"></path></svg></button>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 4px">
<div style="font-size: 12px; text-transform: uppercase; color: #f6f4ec">Card · Tall mug</div>
<div style="font-size: 24px; font-weight: 500; letter-spacing: -0.55px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px">Size</div>
</div>
<button aria-label="More" style="width: 40px; height: 40px; border-radius: 29px; flex-shrink: 0; background: #0e0e0e; border: 1px solid #292929; display: flex; align-items: center; justify-content: center; color: #f6f4ec; padding: 0"><svg width="16" height="16" style="fill: currentColor"><circle cx="3" cy="8" r="1.5"></circle><circle cx="8" cy="8" r="1.5"></circle><circle cx="13" cy="8" r="1.5"></circle></svg></button>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; padding: 16px; overflow: hidden">
<div style="align-self: flex-start; max-width: 310px; box-sizing: border-box; background: linear-gradient(180deg,#6ab8ef 0%,#f4f2ec 100%); color: #040404; padding: 16px; border-radius: 24px 24px 24px 0; font-size: 16px; line-height: 18px">Same size as your Blue Line Mug? It was 9 cm tall.</div>
<sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
<div style="background: #0e0e0e; border: 1px solid #292929; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 16px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 8px"><div style="font-size: 12px; text-transform: uppercase; color: #f6f4ec; letter-spacing: 0.02em; display: flex"><span style="letter-spacing: normal">Fired height</span></div><div style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 40px; font-weight: 500; letter-spacing: -1px">{{h}}</span><span style="font-size: 16px">cm</span></div></div>
<div style="display: flex; flex-direction: column; gap: 8px"><div style="font-size: 12px; text-transform: uppercase; color: #f6f4ec; letter-spacing: 0.02em; display: flex"><span style="letter-spacing: normal">Raw clay</span></div><div style="display: flex; flex-direction: column; gap: 2px"><div style="display: flex; align-items: baseline; gap: 8px; line-height: 1"><span style="font-size: 40px; font-weight: 500; letter-spacing: -1px">{{wet}}</span><span style="font-size: 16px">cm</span></div><div style="font-size: 14px; line-height: 18px">≈ {{clay}} g clay</div></div></div>
</div>

<label style="display: flex; flex-direction: column; gap: 8px; font-size: 12px; text-transform: uppercase"><input type="range" min="5" max="20" step="0.5" value="{{h}}" onChange="{{onH}}"></label>

</div>
<div style="display: flex; justify-content: flex-end; align-items: center; gap: 8px">
<button onClick="{{skip}}" style="height: 40px; padding: 2px 16px 0; border-radius: 100px; border: 1px solid #181818; background: #181818; color: #f6f4ec; font-size: 14px; font-weight: 700; text-transform: uppercase; padding-bottom: 1px">Skip</button>
<button onClick="{{save}}" style="height: 40px; padding: 2px 16px 0; border-radius: 100px; border: 1px solid #292929; background: #f6f4ec; color: #040404; font-size: 14px; font-weight: 700; text-transform: uppercase; padding-bottom: 1px">Save</button>
</div>
</sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<div style="align-self: flex-end; max-width: 300px; box-sizing: border-box; background: #f6f4ec; color: #040404; padding: 16px; border-radius: 24px 24px 0 24px; font-size: 16px; line-height: 18px">{{answer}}</div>
<div style="display: flex; align-items: center; gap: 12px; background: #181818; border-radius: 16px; padding: 12px 16px">
<span style="width: 20px; height: 20px; border-radius: 10px; background: #f6f4ec; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="12" height="12" style="fill: none; stroke: #040404; stroke-width: 2px"><path d="M2 6.5 L5 9 L10 3"></path></svg></span>
<div style="flex-grow: 1; font-size: 14px; line-height: 18px"><div style="font-size: 12px; text-transform: uppercase">Size · saved to card</div>{{written}}</div>
<button onClick="{{undo}}" style="height: 40px; padding: 2px 12px 0; border-radius: 100px; border: none; background: transparent; color: #f6f4ec; font-size: 12px; font-weight: 700; text-transform: uppercase">Undo</button>
</div>
<div style="align-self: flex-start; max-width: 310px; box-sizing: border-box; background: linear-gradient(180deg,#6ab8ef 0%,#f4f2ec 100%); color: #040404; padding: 16px; border-radius: 24px 24px 24px 0; font-size: 16px; line-height: 18px">{{next}}</div>
</sc-if>
</div>
<div style="display: flex; gap: 8px; align-items: center; padding: 12px 16px 28px">
<label style="flex-grow: 1; height: 58px; border-radius: 100px; background: #181818; display: flex; align-items: center; padding: 0 24px; font-size: 16px; color: #54524e">Ask unfired</label>
<button aria-label="Add" style="width: 58px; height: 58px; border-radius: 29px; flex-shrink: 0; background: #0e0e0e; border: 1px solid #292929; display: flex; align-items: center; justify-content: center; color: #f6f4ec; padding: 0"><svg width="24" height="24" style="fill: none; stroke: currentColor; stroke-width: 1.6px"><path d="M12 5 V19 M5 12 H19"></path></svg></button>
<button aria-label="Voice" style="width: 58px; height: 58px; border-radius: 29px; flex-shrink: 0; background: #0e0e0e; border: 1px solid #292929; display: flex; align-items: center; justify-content: center; color: #f6f4ec; padding: 0"><svg width="22" height="22" style="fill: none; stroke: currentColor; stroke-width: 1.6px"><rect x="8" y="2" width="6" height="11" rx="3"></rect><path d="M4.5 10.5 a6.5 6.5 0 0 0 13 0 M11 17 V20"></path></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 402, "height": 874}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { h: 9, saved: false }; }
  pills(list, key) {
    return list.map((o, i) => { const on = i === this.state[key];
      return { label: o.label || o, dot: o.dot || '', hasDot: !!o.dot,
        bg: on ? '#f6f4ec' : '#181818', fg: on ? '#040404' : '#54524e', bd: on ? '#292929' : '#181818',
        pick: () => this.setState({ [key]: i }) }; });
  }
  base(answer, written, next) {
    const sk = this.state.saved === 'skip';
    return { open: !this.state.saved, done: !!this.state.saved,
      answer: sk ? 'Not now' : answer, written: sk ? 'Left empty. I will ask again later.' : written, next,
      save: () => this.setState({ saved: true }), undo: () => this.setState({ saved: false }),
      skip: () => this.setState({ saved: 'skip' }) };
  }
  renderVals() {
    const h = this.state.h, H = h / 0.88, wet = H.toFixed(1);
    // Wet mug: diameter 0.9 × height, wall 0.6 cm, base 0.8 cm, clay 1.9 g/cm³, +15% for trimming.
    const D = 0.9 * H, vol = Math.PI * D * H * 0.6 + Math.PI * (D / 2) * (D / 2) * 0.8;
    const clay = Math.round(vol * 1.9 * 1.15 / 10) * 10;
    return { h, wet, clay, onH: (e) => this.setState({ h: Number(e.target.value) }),
      ...this.base(h + ' cm tall', h + ' cm fired · throw at ' + wet + ' cm · about ' + clay + ' g clay', 'Next gap: clay. Speckled stoneware again?') };
  }
}
</script>
</body>
</html>
